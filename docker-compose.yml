services:
  tg-x-link-transformer:
    build: .
    container_name: tg-x-link-transformer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LINK_SETTINGS_PATH: /data/link-settings.json
    volumes:
      - tg-x-link-transformer-data:/data

volumes:
  tg-x-link-transformer-data:
